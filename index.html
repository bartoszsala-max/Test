<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Titanic Adventure!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060d1f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(80, 180, 255, 0.4);
      max-width: 100vw;
      max-height: 100vh;
    }

    /* ── HTML Game Screens ──────────────────────────────────── */
    .game-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #060d1f 0%, #0a2248 60%, #04111f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 18px;
      z-index: 50;
      color: white;
    }
    .game-screen h1 {
      font-size: clamp(1.8em, 6vw, 3em);
      color: #fffde7;
      text-shadow: 0 0 20px #ffe066;
    }
    .game-screen .sub  { font-size: clamp(1em, 3vw, 1.4em); color: #7fc8ff; }
    .game-screen .hint { font-size: clamp(0.85em, 2.5vw, 1.1em); color: #aaccee; }
    .game-screen .big-score {
      font-size: clamp(1.4em, 5vw, 2.2em);
      font-weight: bold;
      color: #7fc8ff;
    }
    .play-btn {
      padding: clamp(14px, 3vh, 22px) clamp(32px, 7vw, 60px);
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: clamp(1.1em, 4vw, 1.7em);
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .play-btn:active { background: #1e8449; transform: scale(0.97); }
    #screen-gameover { display: none; }
    #screen-gameover h1 { color: #ff6b6b; text-shadow: 0 0 20px #ff0000; }
    #screen-gameover .play-btn { background: #2980b9; }
    #screen-gameover .play-btn:active { background: #1a6b9a; }

    /* ── HTML HUD (score / lives) ──────────────────────────── */
    #hud {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.55);
      color: #fffde7;
      font-size: clamp(14px, 3vw, 22px);
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 10px;
      z-index: 40;
      pointer-events: none;
      letter-spacing: 0.03em;
    }

    /* ── Touch arrow buttons ───────────────────────────────── */
    #touch-controls {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      gap: 20px;
      z-index: 60;
    }
    .ctrl-btn {
      width: 90px; height: 90px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      font-size: 40px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.35); }
    @media (hover: none) and (pointer: coarse) {
      #touch-controls { display: flex; }
    }

    /* ── Portrait rotate prompt ────────────────────────────── */
    #rotate-msg {
      display: none;
      position: fixed;
      inset: 0;
      background: #060d1f;
      z-index: 200;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #7fc8ff;
      text-align: center;
      padding: 30px;
    }
    #rotate-msg .icon { font-size: 72px; margin-bottom: 20px; }
    #rotate-msg h2 { font-size: 24px; color: #fffde7; margin-bottom: 10px; }
    #rotate-msg p  { font-size: 16px; }
    @media (orientation: portrait) {
      #rotate-msg { display: flex; }
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<!-- ── HTML Start Screen ─────────────────────────────────────── -->
<div id="screen-start" class="game-screen">
  <h1>Titanic Adventure!</h1>
  <p class="sub">Dodge the icebergs to survive!</p>
  <p class="hint">Arrow keys &bull; Drag &bull; Use buttons below</p>
  <button class="play-btn" id="btn-play">PLAY</button>
</div>

<!-- ── HTML Game Over Screen ─────────────────────────────────── -->
<div id="screen-gameover" class="game-screen">
  <h1>Game Over!</h1>
  <p class="sub">The Titanic hit an iceberg!</p>
  <p class="big-score" id="final-score">Score: 0</p>
  <button class="play-btn" id="btn-restart">PLAY AGAIN</button>
</div>

<!-- ── Score / Lives HUD ─────────────────────────────────────── -->
<div id="hud">Score: <span id="hud-score">0</span> &nbsp;|&nbsp; Lives: <span id="hud-lives">3</span></div>

<!-- ── Portrait prompt ───────────────────────────────────────── -->
<div id="rotate-msg">
  <div class="icon">&#x21BB;</div>
  <h2>Rotate your device!</h2>
  <p>Titanic Adventure plays in landscape mode.</p>
</div>

<!-- ── Touch controls ────────────────────────────────────────── -->
<div id="touch-controls">
  <button class="ctrl-btn" id="btn-up">&#x2B06;</button>
  <button class="ctrl-btn" id="btn-down">&#x2B07;</button>
</div>

<script>
// ─── Canvas Setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() {
  const aspect = 16 / 9;
  let w = Math.max(window.innerWidth,  320) * 0.97;
  let h = Math.max(window.innerHeight, 200) * 0.97;
  if (w / h > aspect) w = h * aspect;
  else                 h = w / aspect;
  canvas.width  = Math.floor(w);
  canvas.height = Math.floor(h);
  buildStars();
}
window.addEventListener('resize', resize);
resize();
window.addEventListener('load', resize);

const W = () => canvas.width;
const H = () => canvas.height;

// ─── Stars ───────────────────────────────────────────────────────────────────
let stars = [];
function buildStars() {
  stars = Array.from({ length: 120 }, () => ({
    x: Math.random() * W(),
    y: Math.random() * H() * 0.52,
    r: Math.random() * 1.8 + 0.3,
    phase: Math.random() * Math.PI * 2
  }));
}

// ─── Game State ──────────────────────────────────────────────────────────────
let state = 'start';
let score = 0;
let lives = 3;
let frame = 0;
let waveOff = 0;
let invincible = 0;
let icebergs = [];
let spawnTimer = 0;
let baseSpeed = 0;

const ship = { relY: 0.55, vy: 0, speed: 0.006 };

// ─── HTML Screen Management ──────────────────────────────────────────────────
const screenStart    = document.getElementById('screen-start');
const screenGameover = document.getElementById('screen-gameover');
const hudEl          = document.getElementById('hud');
const hudScore       = document.getElementById('hud-score');
const hudLives       = document.getElementById('hud-lives');
const finalScoreEl   = document.getElementById('final-score');

function showStart() {
  screenStart.style.display    = 'flex';
  screenGameover.style.display = 'none';
  hudEl.style.display          = 'none';
}
function showGameover() {
  finalScoreEl.textContent     = 'Score: ' + score;
  screenGameover.style.display = 'flex';
  screenStart.style.display    = 'none';
  hudEl.style.display          = 'none';
}
function showPlaying() {
  screenStart.style.display    = 'none';
  screenGameover.style.display = 'none';
  hudEl.style.display          = 'block';
}

document.getElementById('btn-play').addEventListener('click',    doStart);
document.getElementById('btn-restart').addEventListener('click', doStart);
document.getElementById('btn-play').addEventListener('touchend',    e => { e.preventDefault(); doStart(); }, { passive: false });
document.getElementById('btn-restart').addEventListener('touchend', e => { e.preventDefault(); doStart(); }, { passive: false });

function doStart() { showPlaying(); startGame(); }

// ─── Input ───────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'playing') doStart();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Touch drag on canvas (only for ship movement during play)
let lastTouchY = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'playing') lastTouchY = e.touches[0].clientY;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (lastTouchY === null || state !== 'playing') return;
  const dy = e.touches[0].clientY - lastTouchY;
  lastTouchY = e.touches[0].clientY;
  ship.relY += dy / H();
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { lastTouchY = null; });

// On-screen arrow buttons
const btnUp   = document.getElementById('btn-up');
const btnDown = document.getElementById('btn-down');
const held = { up: false, down: false };
function holdStart(dir) { held[dir] = true;  }
function holdEnd(dir)   { held[dir] = false; }
btnUp.addEventListener('pointerdown',   () => holdStart('up'));
btnUp.addEventListener('pointerup',     () => holdEnd('up'));
btnUp.addEventListener('pointerleave',  () => holdEnd('up'));
btnDown.addEventListener('pointerdown', () => holdStart('down'));
btnDown.addEventListener('pointerup',   () => holdEnd('down'));
btnDown.addEventListener('pointerleave',() => holdEnd('down'));

// ─── Game Logic ──────────────────────────────────────────────────────────────
function startGame() {
  state      = 'playing';
  score      = 0;
  lives      = 3;
  frame      = 0;
  invincible = 0;
  icebergs   = [];
  spawnTimer = 0;
  baseSpeed  = 0;
  ship.relY  = 0.55;
  ship.vy    = 0;
  hudScore.textContent = 0;
  hudLives.textContent = 3;
}

function spawnIceberg() {
  icebergs.push({
    relX:  1.08,
    relY:  0.30 + Math.random() * 0.52,
    size:  0.04 + Math.random() * 0.06,
    speed: baseSpeed + Math.random() * 0.003 + 0.003
  });
}

function update() {
  frame++;
  waveOff += 0.4;
  stars.forEach(s => s.phase += 0.025);
  if (state !== 'playing') return;

  score++;
  baseSpeed = 0.0025 + (score / 4000) * 0.006;

  if      (keys['ArrowUp']   || keys['w'] || keys['W'] || held.up)   ship.vy = -ship.speed;
  else if (keys['ArrowDown'] || keys['s'] || keys['S'] || held.down)  ship.vy =  ship.speed;
  else ship.vy *= 0.8;

  ship.relY = Math.max(0.28, Math.min(0.86, ship.relY + ship.vy));

  spawnTimer++;
  if (spawnTimer >= Math.max(50, 110 - Math.floor(score / 300) * 8)) {
    spawnIceberg(); spawnTimer = 0;
  }

  const shipX = W() * 0.16, shipY = H() * ship.relY, shipR = H() * 0.045;
  icebergs = icebergs.filter(ic => {
    ic.relX -= ic.speed;
    if (invincible <= 0) {
      const icX = W() * ic.relX, icY = H() * ic.relY, icR = H() * ic.size * 0.55;
      const dx = shipX - icX, dy = shipY - icY;
      if (dx*dx + dy*dy < (shipR+icR)*(shipR+icR)) {
        lives--; invincible = 130;
        hudLives.textContent = lives;
        if (lives <= 0) { state = 'gameover'; showGameover(); }
      }
    }
    return ic.relX > -0.12;
  });
  if (invincible > 0) invincible--;

  // Update score every 10 frames to reduce DOM updates
  if (frame % 10 === 0) hudScore.textContent = score;
}

// ─── Drawing ─────────────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawBackground() {
  const w = W(), h = H();
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.58);
  sky.addColorStop(0, '#060d1f');
  sky.addColorStop(1, '#0f2a55');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h * 0.58);

  const sea = ctx.createLinearGradient(0, h * 0.54, 0, h);
  sea.addColorStop(0, '#0a2248');
  sea.addColorStop(1, '#04111f');
  ctx.fillStyle = sea;
  ctx.fillRect(0, h * 0.54, w, h * 0.46);

  stars.forEach(s => {
    const alpha = 0.45 + 0.55 * Math.sin(s.phase);
    ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.save();
  ctx.shadowColor = '#fffacc';
  ctx.shadowBlur  = 30;
  ctx.fillStyle   = '#fffde7';
  ctx.beginPath();
  ctx.arc(w * 0.85, h * 0.13, h * 0.07, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(200,170,80,0.25)';
  ctx.beginPath(); ctx.arc(w*0.855, h*0.11, h*0.018, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(w*0.836, h*0.14, h*0.011, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,250,180,0.08)';
  ctx.fillRect(w * 0.82, h * 0.56, w * 0.06, h * 0.44);
  ctx.fillStyle = 'rgba(30,80,160,0.25)';
  ctx.fillRect(0, h * 0.53, w, h * 0.06);

  for (let row = 0; row < 6; row++) {
    const baseY = h * (0.56 + row * 0.075);
    const amp   = 3 + row * 1.2;
    const freq  = 0.018 - row * 0.001;
    ctx.strokeStyle = 'rgba(80,160,255,' + (0.18 - row * 0.02).toFixed(2) + ')';
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 8) {
      const y = baseY + Math.sin((x + waveOff + row * 40) * freq) * amp;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawTitanic(cx, cy) {
  const h = H();
  const S = h * 0.13;
  ctx.save();
  ctx.translate(cx, cy);

  ctx.fillStyle = '#111128';
  ctx.strokeStyle = '#2a2a50';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-S*0.9, -S*0.18); ctx.lineTo( S*0.8, -S*0.18);
  ctx.lineTo( S*1.1,  S*0.05); ctx.lineTo( S*0.8,  S*0.20);
  ctx.lineTo(-S*0.9,  S*0.20); ctx.lineTo(-S*1.05, S*0.08);
  ctx.lineTo(-S*1.05,-S*0.08); ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#8b0000';
  ctx.fillRect(-S*0.9, S*0.05, S*1.7, S*0.08);
  ctx.fillStyle = '#1e1e3e';
  ctx.fillRect(-S*0.82, -S*0.38, S*1.6, S*0.22);

  ctx.fillStyle = '#2a2a52';
  ctx.beginPath();
  roundRect(-S*0.55, -S*0.70, S*1.0, S*0.34, S*0.04);
  ctx.fill();

  ctx.fillStyle = '#ffff99';
  for (let i = -4; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(i * S*0.18, -S*0.05, S*0.04, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = '#ffe680';
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(i * S*0.16, -S*0.52, S*0.035, 0, Math.PI*2);
    ctx.fill();
  }

  [-S*0.28, -S*0.02, S*0.24].forEach((fx, fi) => {
    ctx.fillStyle = '#8b0000';
    ctx.fillRect(fx - S*0.1, -S*1.1, S*0.2, S*0.45);
    ctx.fillStyle = '#111';
    ctx.fillRect(fx - S*0.11, -S*1.15, S*0.22, S*0.12);
    for (let sp = 0; sp < 4; sp++) {
      const ox = Math.sin(frame * 0.04 + fi + sp * 1.2) * S * 0.08;
      ctx.fillStyle = 'rgba(160,160,160,' + (0.5 - sp*0.1).toFixed(1) + ')';
      ctx.beginPath();
      ctx.arc(fx + ox, -S*(1.15 + sp*0.28), S*(0.08 + sp*0.04), 0, Math.PI*2);
      ctx.fill();
    }
  });

  ctx.strokeStyle = '#444466'; ctx.lineWidth = S*0.025;
  ctx.beginPath(); ctx.moveTo(-S*0.65, -S*0.38); ctx.lineTo(-S*0.65, -S*1.3); ctx.stroke();
  ctx.fillStyle = '#333355';
  ctx.beginPath(); ctx.arc(-S*0.65, -S*1.1, S*0.07, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(S*0.65, -S*0.38); ctx.lineTo(S*0.65, -S*0.9); ctx.stroke();
  ctx.strokeStyle = 'rgba(100,100,140,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-S*0.65, -S*1.3); ctx.lineTo(S*0.65, -S*0.9); ctx.stroke();

  ctx.restore();
}

function drawIceberg(relX, relY, relSize) {
  const w = W(), h = H();
  const x = w * relX, y = h * relY, s = h * relSize;
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = 'rgba(140,220,255,0.55)';
  ctx.shadowBlur  = 18;

  const iceGrad = ctx.createLinearGradient(-s, -s*1.4, s*0.4, s*0.1);
  iceGrad.addColorStop(0.0, '#dff2ff');
  iceGrad.addColorStop(0.4, '#a8d8f0');
  iceGrad.addColorStop(1.0, '#5aabbf');
  ctx.fillStyle = iceGrad;
  ctx.beginPath();
  ctx.moveTo(0, -s*1.45); ctx.lineTo(s*0.38, -s*1.00);
  ctx.lineTo(s*0.70, -s*0.55); ctx.lineTo(s*0.80, -s*0.10);
  ctx.lineTo(s*0.55,  s*0.05); ctx.lineTo(-s*0.55, s*0.05);
  ctx.lineTo(-s*0.80,-s*0.10); ctx.lineTo(-s*0.65,-s*0.55);
  ctx.lineTo(-s*0.30,-s*1.00); ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.moveTo(0, -s*1.45); ctx.lineTo(s*0.22, -s*0.95);
  ctx.lineTo(-s*0.05, -s*0.55); ctx.lineTo(-s*0.28, -s*1.00);
  ctx.closePath(); ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(40,120,170,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, s*0.28, s*0.8, s*0.32, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ─── Main Loop ───────────────────────────────────────────────────────────────
function draw() {
  const w = W(), h = H();
  ctx.clearRect(0, 0, w, h);
  drawBackground();
  icebergs.forEach(ic => drawIceberg(ic.relX, ic.relY, ic.size));
  if (invincible <= 0 || Math.floor(invincible / 10) % 2 === 0) {
    drawTitanic(w * 0.16, h * ship.relY);
  }
}

function loop() {
  requestAnimationFrame(loop);
  try { update(); } catch(e) {}
  try { draw();   } catch(e) {}
}
loop();
</script>
</body>
</html>
