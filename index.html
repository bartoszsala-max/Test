<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Titanic Adventure!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060d1f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(80, 180, 255, 0.4);
      max-width: 100vw;
      max-height: 100vh;
    }
    /* On-screen arrow buttons for iPad / touch */
    #touch-controls {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      gap: 20px;
      z-index: 10;
    }
    .ctrl-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      font-size: 40px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: background 0.1s;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.35); }
    @media (hover: none) and (pointer: coarse) {
      #touch-controls { display: flex; }
    }
    /* Portrait orientation: hide game, show rotate prompt */
    #rotate-msg {
      display: none;
      position: fixed;
      inset: 0;
      background: #060d1f;
      z-index: 200;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #7fc8ff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }
    #rotate-msg .icon { font-size: 80px; margin-bottom: 24px; }
    #rotate-msg h2 { font-size: 26px; color: #fffde7; margin-bottom: 12px; }
    #rotate-msg p  { font-size: 18px; }
    @media (orientation: portrait) {
      #rotate-msg { display: flex; }
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Rotate prompt for portrait screens -->
<div id="rotate-msg">
  <div class="icon">&#x21BB;</div>
  <h2>Rotate your device!</h2>
  <p>Titanic Adventure! plays in landscape mode.</p>
</div>

<!-- Touch controls shown on touch devices -->
<div id="touch-controls">
  <button class="ctrl-btn" id="btn-up">&#x2B06;</button>
  <button class="ctrl-btn" id="btn-down">&#x2B07;</button>
</div>

<script>
// ─── Canvas Setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() {
  const aspect = 16 / 9;
  let w = window.innerWidth  * 0.97;
  let h = window.innerHeight * 0.97;
  if (w / h > aspect) w = h * aspect;
  else                 h = w / aspect;
  canvas.width  = Math.floor(w);
  canvas.height = Math.floor(h);
  // Rebuild stars so they cover the new size
  buildStars();
}
window.addEventListener('resize', resize);
resize();

const W = () => canvas.width;
const H = () => canvas.height;

// ─── Stars ───────────────────────────────────────────────────────────────────
let stars = [];
function buildStars() {
  stars = Array.from({ length: 120 }, () => ({
    x: Math.random() * W(),
    y: Math.random() * H() * 0.52,
    r: Math.random() * 1.8 + 0.3,
    phase: Math.random() * Math.PI * 2
  }));
}

// ─── Game State ──────────────────────────────────────────────────────────────
let state = 'start'; // 'start' | 'playing' | 'gameover'
let score = 0;
let lives = 3;
let frame = 0;
let waveOff = 0;
let invincible = 0;  // frames of invincibility after a hit
let icebergs = [];
let spawnTimer = 0;
let baseSpeed = 0;

// Ship object (positions in 0-1 relative to canvas, scaled at draw)
const ship = {
  relY: 0.55,   // fraction of H
  vy:   0,
  speed: 0.006
};

// ─── Input ───────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup',   e => { keys[e.key] = false; });

// Touch drag on canvas
let lastTouchY = null;
canvas.addEventListener('touchstart', e => {
  lastTouchY = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (lastTouchY === null) return;
  const dy = e.touches[0].clientY - lastTouchY;
  lastTouchY = e.touches[0].clientY;
  ship.relY += dy / H();
  e.preventDefault();
}, { passive: false });

// On-screen buttons
const btnUp   = document.getElementById('btn-up');
const btnDown = document.getElementById('btn-down');
const held = { up: false, down: false };
function holdStart(dir) { held[dir] = true; }
function holdEnd(dir)   { held[dir] = false; }
btnUp.addEventListener('pointerdown',   () => holdStart('up'));
btnUp.addEventListener('pointerup',     () => holdEnd('up'));
btnUp.addEventListener('pointerleave',  () => holdEnd('up'));
btnDown.addEventListener('pointerdown', () => holdStart('down'));
btnDown.addEventListener('pointerup',   () => holdEnd('down'));
btnDown.addEventListener('pointerleave',() => holdEnd('down'));

// Canvas click — for Start / Game-Over buttons
function checkButtonTap(cx, cy) {
  if (state !== 'start' && state !== 'gameover') return;
  const btnX = W() / 2;
  const btnY = state === 'start' ? H() * 0.64 : H() * 0.68;
  const bw   = state === 'start' ? W() * 0.28 : W() * 0.34;
  const bh   = H() * 0.11;
  if (Math.abs(cx - btnX) < bw / 2 && Math.abs(cy - btnY) < bh / 2) {
    startGame();
  }
}
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  checkButtonTap(
    (e.clientX - rect.left) * (W() / rect.width),
    (e.clientY - rect.top)  * (H() / rect.height)
  );
});
canvas.addEventListener('touchend', e => {
  lastTouchY = null;
  const touch = e.changedTouches[0];
  const rect = canvas.getBoundingClientRect();
  checkButtonTap(
    (touch.clientX - rect.left) * (W() / rect.width),
    (touch.clientY - rect.top)  * (H() / rect.height)
  );
});

// ─── Game Logic ──────────────────────────────────────────────────────────────
function startGame() {
  state      = 'playing';
  score      = 0;
  lives      = 3;
  frame      = 0;
  invincible = 0;
  icebergs   = [];
  spawnTimer = 0;
  baseSpeed  = 0;
  ship.relY  = 0.55;
  ship.vy    = 0;
}

function spawnIceberg() {
  const minY = 0.30, maxY = 0.82;
  const spd  = baseSpeed + Math.random() * 0.003 + 0.003;
  icebergs.push({
    relX:  1.08,
    relY:  minY + Math.random() * (maxY - minY),
    size:  0.04 + Math.random() * 0.06,   // fraction of H
    speed: spd
  });
}

function circlesOverlap(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  return (dx*dx + dy*dy) < (ar+br)*(ar+br);
}

function update() {
  frame++;
  waveOff += 0.4;
  stars.forEach(s => s.phase += 0.025);

  if (state !== 'playing') return;

  score++;
  baseSpeed = 0.0025 + (score / 4000) * 0.006;

  // Ship movement
  if (keys['ArrowUp']   || keys['w'] || keys['W'] || held.up)   ship.vy = -ship.speed;
  else if (keys['ArrowDown'] || keys['s'] || keys['S'] || held.down) ship.vy =  ship.speed;
  else ship.vy *= 0.8;

  ship.relY += ship.vy;
  ship.relY  = Math.max(0.28, Math.min(0.86, ship.relY));

  // Spawn icebergs
  spawnTimer++;
  const rate = Math.max(50, 110 - Math.floor(score / 300) * 8);
  if (spawnTimer >= rate) { spawnIceberg(); spawnTimer = 0; }

  // Move & collide
  const shipX = W() * 0.16;
  const shipY = H() * ship.relY;
  const shipR = H() * 0.045;

  icebergs = icebergs.filter(ic => {
    ic.relX -= ic.speed;

    if (invincible <= 0) {
      const icX = W() * ic.relX;
      const icY = H() * ic.relY;
      const icR = H() * ic.size * 0.55;
      if (circlesOverlap(shipX, shipY, shipR, icX, icY, icR)) {
        lives--;
        invincible = 130;
        if (lives <= 0) { state = 'gameover'; }
      }
    }
    return ic.relX > -0.12;
  });

  if (invincible > 0) invincible--;
}

// ─── Drawing Helpers ─────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawBackground() {
  const w = W(), h = H();

  // Night sky
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.58);
  sky.addColorStop(0, '#060d1f');
  sky.addColorStop(1, '#0f2a55');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h * 0.58);

  // Ocean
  const sea = ctx.createLinearGradient(0, h * 0.54, 0, h);
  sea.addColorStop(0, '#0a2248');
  sea.addColorStop(1, '#04111f');
  ctx.fillStyle = sea;
  ctx.fillRect(0, h * 0.54, w, h * 0.46);

  // Stars
  stars.forEach(s => {
    const alpha = 0.45 + 0.55 * Math.sin(s.phase);
    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Moon
  ctx.save();
  ctx.shadowColor = '#fffacc';
  ctx.shadowBlur  = 30;
  ctx.fillStyle   = '#fffde7';
  ctx.beginPath();
  ctx.arc(w * 0.85, h * 0.13, h * 0.07, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Craters
  ctx.fillStyle = 'rgba(200,170,80,0.25)';
  ctx.beginPath(); ctx.arc(w*0.855, h*0.11, h*0.018, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(w*0.836, h*0.14, h*0.011, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Moon shimmer on water
  ctx.fillStyle = 'rgba(255,250,180,0.08)';
  ctx.fillRect(w * 0.82, h * 0.56, w * 0.06, h * 0.44);

  // Horizon glow
  ctx.fillStyle = 'rgba(30,80,160,0.25)';
  ctx.fillRect(0, h * 0.53, w, h * 0.06);

  // Animated waves
  for (let row = 0; row < 6; row++) {
    const baseY = h * (0.56 + row * 0.075);
    const amp   = 3 + row * 1.2;
    const freq  = 0.018 - row * 0.001;
    ctx.strokeStyle = `rgba(80,160,255,${0.18 - row * 0.02})`;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 8) {
      const y = baseY + Math.sin((x + waveOff + row * 40) * freq) * amp;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawTitanic(cx, cy) {
  const h = H();
  const sc = h * 0.001; // scale factor
  const S  = h * 0.13;  // half-length of ship

  ctx.save();
  ctx.translate(cx, cy);

  // Water line (ship sits half in water)
  // Hull
  ctx.fillStyle = '#111128';
  ctx.strokeStyle = '#2a2a50';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-S * 0.9, -S * 0.18);
  ctx.lineTo( S * 0.8, -S * 0.18);
  ctx.lineTo( S * 1.1,  S * 0.05);
  ctx.lineTo( S * 0.8,  S * 0.20);
  ctx.lineTo(-S * 0.9,  S * 0.20);
  ctx.lineTo(-S * 1.05, S * 0.08);
  ctx.lineTo(-S * 1.05,-S * 0.08);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Red waterline stripe
  ctx.fillStyle = '#8b0000';
  ctx.fillRect(-S * 0.9, S * 0.05, S * 1.7, S * 0.08);

  // Deck surface
  ctx.fillStyle = '#1e1e3e';
  ctx.fillRect(-S * 0.82, -S * 0.38, S * 1.6, S * 0.22);

  // Superstructure (central body)
  ctx.fillStyle = '#2a2a52';
  ctx.beginPath();
  roundRect.call(ctx, -S * 0.55, -S * 0.70, S * 1.0, S * 0.34, S * 0.04);
  ctx.fill();

  // Portholes on hull
  ctx.fillStyle = '#ffff99';
  const portholeY = -S * 0.05;
  for (let i = -4; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(i * S * 0.18, portholeY, S * 0.04, 0, Math.PI * 2);
    ctx.fill();
  }

  // Windows on superstructure
  ctx.fillStyle = '#ffe680';
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(i * S * 0.16, -S * 0.52, S * 0.035, 0, Math.PI * 2);
    ctx.fill();
  }

  // Funnels
  const funnelX = [-S*0.28, -S*0.02, S*0.24];
  funnelX.forEach((fx, fi) => {
    // Funnel body
    ctx.fillStyle = '#8b0000';
    ctx.fillRect(fx - S*0.1, -S*1.1, S*0.2, S*0.45);
    // Funnel top (black band)
    ctx.fillStyle = '#111';
    ctx.fillRect(fx - S*0.11, -S*1.15, S*0.22, S*0.12);
    // Smoke puffs
    for (let sp = 0; sp < 4; sp++) {
      const pAlpha = 0.5 - sp * 0.1;
      const ox = Math.sin(frame * 0.04 + fi + sp * 1.2) * S * 0.08;
      const oy = -S * (1.15 + sp * 0.28);
      ctx.fillStyle = `rgba(160,160,160,${pAlpha})`;
      ctx.beginPath();
      ctx.arc(fx + ox, oy, S * (0.08 + sp * 0.04), 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Forward mast
  ctx.strokeStyle = '#444466';
  ctx.lineWidth = S * 0.025;
  ctx.beginPath();
  ctx.moveTo(-S * 0.65, -S * 0.38);
  ctx.lineTo(-S * 0.65, -S * 1.3);
  ctx.stroke();
  // Crow's nest
  ctx.fillStyle = '#333355';
  ctx.beginPath();
  ctx.arc(-S * 0.65, -S * 1.1, S * 0.07, 0, Math.PI * 2);
  ctx.fill();

  // Rear mast
  ctx.beginPath();
  ctx.moveTo(S * 0.65, -S * 0.38);
  ctx.lineTo(S * 0.65, -S * 0.9);
  ctx.stroke();

  // Rigging lines
  ctx.strokeStyle = 'rgba(100,100,140,0.5)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(-S*0.65, -S*1.3);
  ctx.lineTo(S*0.65, -S*0.9);
  ctx.stroke();

  ctx.restore();
}

function drawIceberg(relX, relY, relSize) {
  const w = W(), h = H();
  const x = w * relX;
  const y = h * relY;
  const s = h * relSize;

  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = 'rgba(140,220,255,0.55)';
  ctx.shadowBlur  = 18;

  // Main above-water mass
  const iceGrad = ctx.createLinearGradient(-s, -s * 1.4, s * 0.4, s * 0.1);
  iceGrad.addColorStop(0.0, '#dff2ff');
  iceGrad.addColorStop(0.4, '#a8d8f0');
  iceGrad.addColorStop(1.0, '#5aabbf');
  ctx.fillStyle = iceGrad;

  ctx.beginPath();
  ctx.moveTo(0,        -s * 1.45);
  ctx.lineTo(s * 0.38, -s * 1.00);
  ctx.lineTo(s * 0.70, -s * 0.55);
  ctx.lineTo(s * 0.80, -s * 0.10);
  ctx.lineTo(s * 0.55,  s * 0.05);
  ctx.lineTo(-s * 0.55, s * 0.05);
  ctx.lineTo(-s * 0.80,-s * 0.10);
  ctx.lineTo(-s * 0.65,-s * 0.55);
  ctx.lineTo(-s * 0.30,-s * 1.00);
  ctx.closePath();
  ctx.fill();

  // Highlight facets
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.moveTo(0,         -s * 1.45);
  ctx.lineTo(s * 0.22,  -s * 0.95);
  ctx.lineTo(-s * 0.05, -s * 0.55);
  ctx.lineTo(-s * 0.28, -s * 1.00);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  // Underwater bulk (tip of iceberg)
  ctx.fillStyle = 'rgba(40,120,170,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.28, s * 0.8, s * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawHeart(cx, cy, size, filled) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = filled ? '#ff4455' : 'rgba(255,68,85,0.2)';
  ctx.strokeStyle = '#ff4455';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, size * 0.4);
  ctx.bezierCurveTo( size, -size*0.1,  size*1.2, -size*0.8, 0, -size*0.6);
  ctx.bezierCurveTo(-size*1.2, -size*0.8, -size, -size*0.1, 0, size*0.4);
  ctx.fill();
  if (!filled) ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  const w = W(), h = H();
  // Score badge
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(w * 0.01, h * 0.02, w * 0.2, h * 0.09, h * 0.02);
  ctx.fill();
  ctx.fillStyle = '#fffde7';
  ctx.font = `bold ${Math.round(h * 0.047)}px Arial`;
  ctx.textAlign = 'left';
  ctx.fillText(`⭐ ${score}`, w * 0.03, h * 0.083);

  // Lives
  const heartSize = h * 0.028;
  for (let i = 0; i < 3; i++) {
    drawHeart(w * 0.03 + i * heartSize * 2.6, h * 0.145, heartSize, i < lives);
  }
}

function drawButton(label, cx, cy, bw, bh, col1, col2) {
  const pulse = 1 + 0.04 * Math.sin(frame * 0.08);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(pulse, pulse);
  const grad = ctx.createLinearGradient(0, -bh/2, 0, bh/2);
  grad.addColorStop(0, col1);
  grad.addColorStop(1, col2);
  ctx.fillStyle = grad;
  ctx.shadowColor = col1;
  ctx.shadowBlur  = 18;
  roundRect(-bw/2, -bh/2, bw, bh, bh/2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle  = 'white';
  ctx.font       = `bold ${Math.round(bh * 0.52)}px Arial`;
  ctx.textAlign  = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, 0);
  ctx.restore();
}

function drawStartScreen() {
  const w = W(), h = H();
  // Overlay
  ctx.fillStyle = 'rgba(0,5,20,0.55)';
  ctx.fillRect(0, 0, w, h);

  ctx.textAlign = 'center';

  // Title
  ctx.fillStyle = '#fffde7';
  ctx.font      = `bold ${Math.round(h * 0.09)}px Arial`;
  ctx.shadowColor = '#ffe066';
  ctx.shadowBlur  = 20;
  ctx.fillText('Titanic Adventure!', w / 2, h * 0.22);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.fillStyle = '#7fc8ff';
  ctx.font      = `${Math.round(h * 0.048)}px Arial`;
  ctx.fillText('Help the Titanic dodge icebergs!', w / 2, h * 0.36);

  // Instruction icons
  ctx.fillStyle = '#aaccee';
  ctx.font      = `${Math.round(h * 0.037)}px Arial`;
  ctx.fillText('⬆ ⬇  Arrow keys  •  Drag on iPad', w / 2, h * 0.47);

  // Play button
  const bw = w * 0.28, bh = h * 0.11;
  drawButton('🚢  PLAY!', w / 2, h * 0.64, bw, bh, '#2ecc71', '#1a8f4f');
}

function drawGameOver() {
  const w = W(), h = H();
  ctx.fillStyle = 'rgba(0,5,20,0.65)';
  ctx.fillRect(0, 0, w, h);

  ctx.textAlign = 'center';

  // Title
  ctx.fillStyle = '#ff6b6b';
  ctx.font      = `bold ${Math.round(h * 0.09)}px Arial`;
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur  = 20;
  ctx.fillText('Oh no! 🧊', w / 2, h * 0.22);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fffde7';
  ctx.font      = `${Math.round(h * 0.048)}px Arial`;
  ctx.fillText('The Titanic hit an iceberg!', w / 2, h * 0.36);

  ctx.fillStyle = '#7fc8ff';
  ctx.font      = `bold ${Math.round(h * 0.065)}px Arial`;
  ctx.fillText(`⭐  Score: ${score}`, w / 2, h * 0.50);

  // Play Again button
  const bw = w * 0.34, bh = h * 0.11;
  drawButton('Play Again! 🚢', w / 2, h * 0.68, bw, bh, '#2196f3', '#0d47a1');
}

// ─── Main Loop ───────────────────────────────────────────────────────────────
function draw() {
  const w = W(), h = H();
  ctx.clearRect(0, 0, w, h);
  drawBackground();

  // Icebergs
  icebergs.forEach(ic => drawIceberg(ic.relX, ic.relY, ic.size));

  // Ship (blink when invincible)
  if (invincible <= 0 || Math.floor(invincible / 10) % 2 === 0) {
    drawTitanic(w * 0.16, h * ship.relY);
  }

  if (state === 'playing') {
    drawHUD();
  } else if (state === 'start') {
    drawStartScreen();
  } else if (state === 'gameover') {
    drawGameOver();
    drawHUD();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
